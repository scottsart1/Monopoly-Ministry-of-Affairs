<title>Velvet &amp; Roulette</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ground:#160A10;
    --surface:#23121B;
    --surface-2:#2C1721;
    --edge:#3A1F2C;
    --rose:#E4587A;
    --rose-soft:#F08CA5;
    --gold:#D9A360;
    --gold-bright:#F2C57C;
    --cream:#F0DFE2;
    --dim:#A98492;
    --teal:#4FA894;
    --violet:#B07BD6;
    --ember:#E8643C;
    --ring-track:#3A1F2C;
    --heat:#D9A360;
    --charge:0;
  }
  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{
    margin:0;
    background:var(--ground);
    color:var(--cream);
    font-family:'Outfit',system-ui,-apple-system,sans-serif;
    font-weight:300;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
    overflow-x:hidden;
  }
  button{font-family:inherit;cursor:pointer}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
    outline:2px solid var(--gold);outline-offset:2px;border-radius:4px;
  }
  small{display:block;font-size:12px;color:var(--dim);font-weight:300;margin-top:2px}

  .shell{max-width:520px;margin:0 auto;padding:0 20px 120px;position:relative}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;justify-content:space-between;padding:24px 0 4px;gap:10px}
  .brand{font-family:'Cormorant',Georgia,serif;font-style:italic;font-weight:600;font-size:30px;letter-spacing:.01em;color:var(--cream);line-height:1}
  .brand .amp{color:var(--rose)}
  .header-btns{display:flex;gap:6px;flex:none}
  .ghost-btn{
    background:none;border:1px solid var(--edge);color:var(--dim);
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;
    padding:7px 12px;border-radius:999px;transition:color .2s,border-color .2s;
  }
  .ghost-btn:hover{color:var(--cream);border-color:var(--gold)}

  .heatbar{display:flex;align-items:center;justify-content:space-between;margin:14px 0 22px;gap:12px}
  .heat{display:flex;align-items:center;gap:10px}
  .pips{display:flex;gap:5px;align-items:flex-end}
  .pip{width:9px;height:12px;border-radius:5px 5px 6px 6px;background:var(--edge);transition:background .4s,box-shadow .4s,height .4s}
  .pip:nth-child(2){height:15px}.pip:nth-child(3){height:18px}.pip:nth-child(4){height:21px}
  .pip.on{background:var(--heat);box-shadow:0 0 12px var(--heat)}
  .heat-label{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
  .heat-label b{color:var(--heat);font-weight:600;transition:color .4s}
  .heat-next{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-align:right}

  /* ---------- turn chip ---------- */
  .turn{
    align-self:center;background:var(--surface);border:1px solid var(--edge);color:var(--cream);
    border-radius:999px;padding:8px 16px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;
    display:flex;gap:10px;align-items:center;transition:border-color .2s;
  }
  .turn:hover{border-color:var(--gold)}
  .turn .dot{width:8px;height:8px;border-radius:50%;background:var(--rose)}
  .turn.him .dot{background:var(--gold)}
  .turn small{display:inline;color:var(--dim);letter-spacing:.08em;text-transform:none;font-size:11px;margin:0}

  /* ---------- wheel stage ---------- */
  .stage{position:relative;display:flex;flex-direction:column;align-items:center}
  .wheel-wrap{position:relative;width:min(88vw,420px);aspect-ratio:1;margin-top:22px;user-select:none;-webkit-user-select:none}
  .halo{position:absolute;inset:-14%;border-radius:50%;pointer-events:none;filter:blur(22px);opacity:.9;transition:background 1s}
  .halo.flicker{animation:flicker 3.2s ease-in-out infinite}
  @keyframes flicker{0%,100%{opacity:.75;transform:scale(1)}40%{opacity:1;transform:scale(1.03)}70%{opacity:.85;transform:scale(.99)}}
  #wheel{position:relative;width:100%;height:100%;display:block;border-radius:50%;
    box-shadow:0 0 0 1px var(--edge),0 24px 60px rgba(0,0,0,.55)}
  #sparks{position:absolute;left:-20%;top:-20%;width:140%;height:140%;pointer-events:none;z-index:4}
  .pointer{
    position:absolute;top:-9px;left:50%;transform:translateX(-50%);
    width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;
    border-top:24px solid var(--gold);filter:drop-shadow(0 3px 6px rgba(0,0,0,.6));z-index:3;
  }
  .charge-ring{
    position:absolute;top:50%;left:50%;width:106px;height:106px;transform:translate(-50%,-50%);
    border-radius:50%;z-index:2;pointer-events:none;
    background:conic-gradient(var(--gold-bright) calc(var(--charge) * 360deg), transparent 0);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));
    mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));
  }
  .hub{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:88px;height:88px;border-radius:50%;
    background:var(--surface);border:1px solid var(--gold);
    color:var(--gold);font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;
    display:flex;align-items:center;justify-content:center;z-index:3;
    box-shadow:0 0 24px rgba(217,163,96,.25), inset 0 0 18px rgba(0,0,0,.5);
    transition:transform .12s,box-shadow .3s;
    touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  }
  .hub:disabled{color:var(--dim);border-color:var(--edge);cursor:default;box-shadow:none}
  .hint{margin-top:16px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);text-align:center}
  .rounds{margin-top:8px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .rounds b{color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}

  /* ---------- result card ---------- */
  .card{
    margin-top:26px;width:100%;background:var(--surface);border:1px solid var(--edge);
    border-radius:18px;padding:26px 24px 22px;text-align:center;
    animation:rise .45s cubic-bezier(.2,.9,.3,1);position:relative;overflow:hidden;
  }
  .card.jackpot{border-color:var(--gold);box-shadow:0 0 50px rgba(217,163,96,.25)}
  .card.mystery{border-color:#000;background:#0E0A0E;box-shadow:0 0 50px rgba(0,0,0,.6)}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
  .tag{
    display:inline-block;font-size:10px;letter-spacing:.24em;text-transform:uppercase;font-weight:600;
    padding:5px 12px;border-radius:999px;border:1px solid currentColor;
  }
  .tag.her{color:var(--rose-soft)} .tag.him{color:var(--gold)}
  .tag.both{color:var(--violet)} .tag.wild{color:var(--teal)}
  .tag.mystery{color:var(--dim)} .tag.jackpot{color:var(--gold-bright);background:rgba(217,163,96,.12)}
  .tag.confession{color:#CFA0E0} .tag.dare{color:#F08A6A}
  .tag.spinner{color:var(--dim);border-style:dashed}
  .card h2{font-family:'Cormorant',Georgia,serif;font-weight:600;font-size:30px;line-height:1.15;margin:0 0 10px;text-wrap:balance}
  .card.jackpot.pick h2{color:var(--gold-bright);font-size:44px;letter-spacing:.04em;font-style:italic}
  .card.mystery h2{font-size:54px;color:var(--gold);letter-spacing:.2em}
  .card .note{font-family:'Cormorant',Georgia,serif;font-style:italic;font-size:18px;color:var(--dim);margin:0 0 16px;line-height:1.4}
  .extras{display:flex;flex-direction:column;gap:8px;margin:0 0 18px}
  .twist{
    background:var(--surface-2);border:1px solid var(--ember);color:var(--cream);border-radius:12px;padding:10px 14px;
    font-size:14px;animation:flip .55s cubic-bezier(.2,.9,.3,1);transform-origin:top;
  }
  .twist b{color:var(--ember);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:10px;display:block;margin-bottom:3px}
  @keyframes flip{from{opacity:0;transform:perspective(500px) rotateX(-70deg)}to{opacity:1;transform:none}}
  .focus{font-size:13px;color:var(--dim);letter-spacing:.06em}
  .focus b{color:var(--gold);font-weight:500}
  .card .clock-line{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:20px}
  .card .clock-line b{color:var(--cream);font-family:'DM Mono',monospace;font-variant-numeric:tabular-nums;font-weight:500;letter-spacing:.05em}
  .card-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .card select{
    width:100%;background:var(--surface-2);border:1px solid var(--edge);color:var(--cream);
    border-radius:10px;padding:12px 13px;font-family:inherit;font-size:14px;margin-bottom:16px;
  }
  .primary-btn{
    background:var(--rose);color:#2A0A14;border:none;border-radius:999px;
    font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
    padding:14px 26px;transition:transform .15s,box-shadow .2s;
    box-shadow:0 6px 24px rgba(228,88,122,.35);
  }
  .primary-btn:hover{transform:translateY(-1px)}
  .primary-btn.gold{background:var(--gold);box-shadow:0 6px 24px rgba(217,163,96,.35)}
  .quiet-btn{
    background:none;border:1px solid var(--edge);color:var(--dim);border-radius:999px;
    font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;padding:14px 22px;
    transition:color .2s,border-color .2s;
  }
  .quiet-btn:hover{color:var(--cream);border-color:var(--dim)}
  .veto-note{margin-top:14px;color:var(--dim);font-style:italic;font-family:'Cormorant',Georgia,serif;font-size:15px;text-align:center}

  /* ---------- timer overlay ---------- */
  .overlay{
    position:fixed;inset:0;background:var(--ground);z-index:40;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;text-align:center;overflow-y:auto;
  }
  .overlay.flash{animation:flash .6s ease-out}
  @keyframes flash{0%{background:#5A1A2C}100%{background:var(--ground)}}
  .t-label{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:10px}
  .t-name{font-family:'Cormorant',Georgia,serif;font-weight:600;font-size:30px;margin:0 0 14px;max-width:440px;text-wrap:balance;line-height:1.15}
  .t-extras{display:flex;flex-direction:column;gap:6px;margin-bottom:22px;max-width:380px}
  .ring-wrap{position:relative;width:min(70vw,300px);aspect-ratio:1;flex:none}
  .ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring-track{fill:none;stroke:var(--ring-track);stroke-width:6}
  .ring-fill{fill:none;stroke:var(--gold);stroke-width:6;stroke-linecap:round;transition:stroke .4s}
  .ring-wrap.hot .ring-fill{stroke:var(--rose)}
  .ring-wrap.veiled .ring-fill{stroke-dasharray:6 14 !important;stroke-dashoffset:0 !important;animation:crawl 2.4s linear infinite;stroke:var(--dim)}
  @keyframes crawl{to{stroke-dashoffset:-40}}
  .t-digits{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:'DM Mono',monospace;font-variant-numeric:tabular-nums;
  }
  .t-digits .big{font-size:56px;font-weight:500;letter-spacing:.02em}
  .t-digits .veil{font-family:'Cormorant',Georgia,serif;font-style:italic;font-size:22px;color:var(--dim);max-width:180px;line-height:1.3}
  .ring-wrap.hot .big{color:var(--rose);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.55}}
  .t-hint{margin-top:24px;font-family:'Cormorant',Georgia,serif;font-style:italic;font-size:18px;color:var(--dim);max-width:340px;line-height:1.4}
  .t-end{margin-top:26px}
  .stopped{max-width:420px}
  .stopped h1{font-family:'Cormorant',Georgia,serif;font-style:italic;font-weight:600;font-size:60px;color:var(--rose);margin:0 0 8px;animation:pulse 1.2s infinite}
  .stopped p{color:var(--dim);font-size:15px;margin:0 0 26px}
  .heat-up{
    background:var(--surface);border:1px solid var(--heat);border-radius:14px;padding:14px 18px;margin:0 0 24px;
    box-shadow:0 0 40px rgba(232,100,60,.2);animation:rise .5s;
  }
  .heat-up b{display:block;color:var(--heat);font-size:11px;letter-spacing:.28em;text-transform:uppercase;margin-bottom:4px}
  .heat-up span{font-family:'Cormorant',Georgia,serif;font-size:20px;font-style:italic}
  .gamble{background:var(--surface);border:1px solid var(--edge);border-radius:16px;padding:20px;margin-bottom:8px;animation:rise .5s}
  .gamble h3{font-family:'Cormorant',Georgia,serif;font-style:italic;font-weight:600;font-size:28px;margin:0 0 6px;color:var(--gold)}
  .gamble p{margin:0 0 16px;font-size:14px;color:var(--dim)}
  .coin{width:92px;height:92px;margin:6px auto 18px;position:relative;transform-style:preserve-3d;transition:transform 1.7s cubic-bezier(.2,.8,.2,1)}
  .coin .face{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-family:'Cormorant',Georgia,serif;font-weight:700;font-size:20px;letter-spacing:.1em;border:2px solid rgba(0,0,0,.3)}
  .coin .front{background:var(--gold);color:#2A0A14}
  .coin .back{background:var(--rose);color:#2A0A14;transform:rotateY(180deg)}
  .result{font-family:'Cormorant',Georgia,serif;font-style:italic;font-size:22px;margin:0 0 16px;min-height:1.4em}

  /* ---------- plot-twist banner ---------- */
  .banner{
    position:fixed;left:50%;top:16px;transform:translateX(-50%) translateY(-160%);
    transition:transform .45s cubic-bezier(.2,.9,.3,1);z-index:80;
    background:var(--ember);color:#1A0806;padding:14px 20px;border-radius:14px;max-width:min(92vw,440px);text-align:center;
    box-shadow:0 12px 40px rgba(0,0,0,.5);
  }
  .banner.show{transform:translateX(-50%) translateY(0)}
  .banner b{display:block;font-size:10px;letter-spacing:.3em;text-transform:uppercase;margin-bottom:4px;font-weight:700}
  .banner span{font-family:'Cormorant',Georgia,serif;font-weight:700;font-size:22px;line-height:1.2}

  /* ---------- gate & rules ---------- */
  .gate{z-index:60}
  .gate-inner{max-width:400px}
  .gate h1{font-family:'Cormorant',Georgia,serif;font-style:italic;font-weight:600;font-size:46px;margin:0 0 4px}
  .gate .amp{color:var(--rose)}
  .gate .sub{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);margin:0 0 30px}
  .rules{list-style:none;margin:0 0 32px;padding:0;text-align:left;display:flex;flex-direction:column;gap:13px}
  .rules li{display:flex;gap:14px;align-items:baseline;font-size:15px;line-height:1.45;color:var(--cream)}
  .rules .r-mark{color:var(--gold);font-family:'Cormorant',Georgia,serif;font-style:italic;flex:none;min-width:22px}
  .rules em{color:var(--rose-soft);font-style:normal;font-weight:500}

  /* ---------- finish / night report ---------- */
  .finish{z-index:50}
  #confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .finish-inner{position:relative;max-width:440px;width:100%}
  .finish h1{font-family:'Cormorant',Georgia,serif;font-style:italic;font-weight:600;font-size:44px;margin:0 0 6px;color:var(--gold)}
  .finish .lede{color:var(--dim);font-size:15px;margin:0 0 22px;line-height:1.5}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left;margin-bottom:16px}
  .stat{background:var(--surface);border:1px solid var(--edge);border-radius:12px;padding:12px 14px}
  .stat b{display:block;font-family:'DM Mono',monospace;font-size:22px;color:var(--gold);font-weight:500;font-variant-numeric:tabular-nums}
  .stat span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  .aftercare{background:var(--surface);border:1px solid var(--edge);border-radius:14px;padding:16px 18px;margin-bottom:22px;text-align:left}
  .aftercare b{display:block;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--rose-soft);margin-bottom:6px}
  .aftercare p{margin:0;font-family:'Cormorant',Georgia,serif;font-size:19px;font-style:italic;line-height:1.4}

  /* ---------- settings drawer ---------- */
  .drawer{position:fixed;inset:0;z-index:55;background:rgba(12,5,9,.72);display:flex;justify-content:flex-end}
  .drawer-panel{
    width:min(94vw,440px);height:100%;background:var(--surface);border-left:1px solid var(--edge);
    padding:22px 20px 60px;overflow-y:auto;animation:slide .3s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
  .drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
  .drawer-head h2{font-family:'Cormorant',Georgia,serif;font-style:italic;font-weight:600;font-size:26px;margin:0}
  .drawer-sub{font-size:12px;color:var(--dim);margin:0 0 6px;line-height:1.5}
  .sec-title{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin:26px 0 10px;font-weight:600}
  .seg{display:flex;border:1px solid var(--edge);border-radius:999px;overflow:hidden}
  .seg button{flex:1;background:none;border:none;color:var(--dim);padding:10px 4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:500}
  .seg button.on{background:var(--rose);color:#2A0A14;font-weight:600}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
  .field label{font-size:12px;color:var(--dim);letter-spacing:.06em}
  .drawer input[type=text],.drawer input[type=number],.drawer select,.drawer textarea{
    background:var(--surface-2);border:1px solid var(--edge);color:var(--cream);
    border-radius:10px;padding:11px 13px;font-family:inherit;font-size:14px;width:100%;
  }
  .drawer textarea{min-height:76px;resize:vertical;line-height:1.4}
  .duo{display:flex;gap:10px}
  .tog{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--edge);font-size:14px;cursor:pointer}
  .tog b{font-weight:500}
  .tog input{accent-color:var(--rose);width:18px;height:18px;flex:none}
  .act-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--edge)}
  .act-row label{flex:1;font-size:14px;display:flex;align-items:center;gap:12px;cursor:pointer;line-height:1.3}
  .act-row input[type=checkbox]{accent-color:var(--rose);width:17px;height:17px;flex:none}
  .act-row .meta{font-family:'DM Mono',monospace;font-size:11px;color:var(--dim);flex:none;font-variant-numeric:tabular-nums;text-align:right;line-height:1.5}
  .act-row .meta i{font-style:normal;color:var(--ember);letter-spacing:-2px}
  .act-row .del{background:none;border:none;color:var(--dim);font-size:16px;padding:4px 6px}
  .act-row .del:hover{color:var(--rose)}
  .off label{color:var(--dim);text-decoration:line-through;text-decoration-color:rgba(169,132,146,.5)}
  .add-form{margin-top:14px;display:flex;flex-direction:column;gap:10px}
  .drawer-foot{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}

  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--surface-2);border:1px solid var(--edge);color:var(--cream);padding:12px 18px;border-radius:999px;
    font-size:13px;z-index:90;transition:transform .3s,opacity .3s;pointer-events:none;max-width:90vw;text-align:center;
  }
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
    .halo.flicker{animation:none}
  }
</style>

<div class="shell">
  <header>
    <div class="brand">Velvet <span class="amp">&amp;</span> Roulette</div>
    <div class="header-btns">
      <button class="ghost-btn" id="rulesBtn">Rules</button>
      <button class="ghost-btn" id="editBtn">Menu</button>
    </div>
  </header>

  <div class="heatbar">
    <div class="heat">
      <div class="pips" aria-hidden="true"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
      <div class="heat-label">Heat · <b id="heatName">Simmer</b></div>
    </div>
    <div class="heat-next" id="heatNext"></div>
  </div>

  <div class="stage">
    <button class="turn" id="turnBtn" title="Tap to swap whose spin it is"><span class="dot"></span><span id="turnText">Her spin</span><small>tap to swap</small></button>
    <div class="wheel-wrap">
      <div class="halo" id="halo"></div>
      <div class="pointer" aria-hidden="true"></div>
      <canvas id="wheel" aria-label="Activity wheel"></canvas>
      <canvas id="sparks" aria-hidden="true"></canvas>
      <div class="charge-ring" aria-hidden="true"></div>
      <button class="hub" id="spinBtn">Spin</button>

    if(spinning) return;
    if(eligibleActs().length<2){ toast('Turn on at least two activities in the menu first.'); return; }
    audio();
    var list=slices(), n=list.length, per=Math.PI*2/n;
    var spinner=turn;
    if(spinner==='her') stats.spinsHer++; else stats.spinsHim++;
    spinning=true; hub.disabled=true; clearResult();
    var idx=Math.floor(Math.random()*n);
    var targetMod=mod(-(idx*per+per/2)), curMod=mod(angle);
    var delta=targetMod-curMod; if(delta<=0) delta+=Math.PI*2;
    var turns=reduced?1:4+Math.round(power*6);
    var total=turns*Math.PI*2+delta;
    var dur=reduced?700:3200+power*3800;
    var start=null, from=angle, lastSeg=-1, expo=3+power*1.5;
    function frame(ts){
      if(!start) start=ts;
      var t=Math.min(1,(ts-start)/dur), ease=1-Math.pow(1-t,expo);
      angle=from+total*ease;
      var seg=Math.floor(((-angle-Math.PI/2)%(Math.PI*2))/per);
      if(seg!==lastSeg){ if(!reduced) tick(); lastSeg=seg; }
      draw();
      if(t<1){ requestAnimationFrame(frame); return; }
      spinning=false; hub.disabled=false;
      var s=list[idx];
      vibrate(s.kind==='jackpot'?[60,40,60,40,120]:60);
      sparks(TAG_GLOW[s.tag]||TAG_GLOW.wild);
      turn=spinner==='her'?'him':'her'; save(); updateTurn();
      land(s,spinner);
    }
    requestAnimationFrame(frame);
  }

    clearResult();

    var digits=el('div','t-digits');
    if(veiled) digits.appendChild(el('span','veil','the bell knows'));
    else { var big=el('span','big',fmt(left)); big.id='digits'; digits.appendChild(big); }
    ring.appendChild(digits); timerEl.appendChild(ring);
    timerEl.appendChild(el('p','t-hint',opts.penalty?'Hands behind your backs. Words only. Make them count.':'When the bell rings, everything stops. Everything.'));
    var endBtn=el('button','quiet-btn t-end','Stop early'); endBtn.addEventListener('click',function(){ closeTimer(); });
    timerEl.appendChild(endBtn);
    document.body.appendChild(timerEl);

    var startedAt=Date.now(), endAt=startedAt+left*1000, lastShown=left;
    var plotAt=(settings.plot && !opts.overtime && total>=90 && Math.random()<.3) ? total*(.3+Math.random()*.4) : -1, plotDone=false;
    timerInt=setInterval(function(){

  function confetti(cv){
    var c=cv.getContext('2d'), W=cv.width=cv.clientWidth, H=cv.height=cv.clientHeight, run=true;
    var COLS=['#E4587A','#D9A360','#F0DFE2','#B07BD6','#F2C57C'];
    var ps=[]; for(var i=0;i<140;i++) ps.push({x:Math.random()*W,y:-Math.random()*H,r:3+Math.random()*5,vy:1.5+Math.random()*2.5,vx:-1+Math.random()*2,rot:Math.random()*6,vr:-.1+Math.random()*.2,col:COLS[i%COLS.length]});
    (function loop(){
      if(!run) return; c.clearRect(0,0,W,H);
      ps.forEach(function(p){ p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; if(p.y>H+10){p.y=-10;p.x=Math.random()*W;}

      requestAnimationFrame(loop);
    })();
    return function(){run=false;};
  }

      var name=el('input'); name.type='text'; name.name='name'; name.maxLength=90; name.placeholder='New activity — say it plainly'; name.required=true;
      var wheel=el('input'); wheel.type='text'; wheel.name='wheel'; wheel.maxLength=14; wheel.placeholder='Wheel label'; wheel.required=true;
      var tag=el('select'); [['both','Together'],['her','For her'],['him','For him'],['wild','Wildcard']].forEach(function(t){ var o=el('option',null,t[1]); o.value=t[0]; tag.appendChild(o); });
      var heat=el('select'); HEAT_NAMES.forEach(function(nm,i){ var o=el('option',null,'🔥'.repeat(i+1)+' '+nm); o.value=String(i+1); heat.appendChild(o); });
      var mn=el('input'); mn.type='number'; mn.min='1'; mn.max='30'; mn.value='3'; mn.setAttribute('aria-label','Minimum minutes');
      var mx=el('input'); mx.type='number'; mx.min='1'; mx.max='30'; mx.value='6'; mx.setAttribute('aria-label','Maximum minutes');
      var d1=el('div','duo'); d1.appendChild(wheel); d1.appendChild(tag);
      var d2=el('div','duo'); d2.appendChild(heat); d2.appendChild(mn); d2.appendChild(mx);
      var sub=el('button','primary-btn','Add to the wheel'); sub.type='submit';
      form.appendChild(name); form.appendChild(d1); form.appendChild(d2); form.appendChild(sub);
      form.addEventListener('submit',function(ev){
        ev.preventDefault();
        var lo=Math.max(1,parseInt(mn.value,10)||3), hi=Math.max(lo,parseInt(mx.value,10)||6);
        acts.push({id:'c'+Date.now(),name:name.value.trim(),wheel:wheel.value.trim()||name.value.trim().slice(0,14),tag:tag.value,heat:parseInt(heat.value,10)||1,min:lo,max:hi,note:'House special.',on:true});
        save(); draw(); updateHeatUI(); render(); panel.scrollTop=panel.scrollHeight;
      });
      panel.appendChild(form);

      var foot=el('div','drawer-foot');
      var reset=el('button','quiet-btn','Reset to house menu'); reset.addEventListener('click',function(){ acts=defaults(); save(); draw(); updateHeatUI(); render(); toast('House menu restored.'); });
      foot.appendChild(reset); panel.appendChild(foot);
    }
    render();
    d.addEventListener('click',function(ev){ if(ev.target===d) d.remove(); });
    document.body.appendChild(d);
  }

  /* ---------- wire up ---------- */
  hub.addEventListener('pointerdown',chargeBegin);
  window.addEventListener('pointerup',chargeEnd);
  window.addEventListener('pointercancel',chargeEnd);
  hub.addEventListener('contextmenu',function(e){ e.preventDefault(); });
  hub.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); spin(.5); } });
  canvas.addEventListener('click',function(){ spin(.3+Math.random()*.5); });
  document.getElementById('turnBtn').addEventListener('click',function(){ turn=turn==='her'?'him':'her'; save(); updateTurn(); });
  document.getElementById('rulesBtn').addEventListener('click',function(){ showGate(false); });
  document.getElementById('editBtn').addEventListener('click',showSettings);
  document.getElementById('finishBtn').addEventListener('click',showFinish);
  window.addEventListener('resize',sizeCanvas);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
  updateHeatUI(); updateTurn(); sizeCanvas();
  showGate(true);
})();
</script>
