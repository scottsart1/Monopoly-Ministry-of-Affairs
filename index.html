<title>Velvet &amp; Roulette</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ground:#160A10;
    --surface:#23121B;
    --surface-2:#2C1721;
    --edge:#3A1F2C;
    --rose:#E4587A;
    --rose-soft:#F08CA5;
    --gold:#D9A360;
    --gold-bright:#F2C57C;
    --cream:#F0DFE2;
    --dim:#A98492;
    --teal:#4FA894;
    --violet:#B07BD6;
    --ember:#E8643C;
    --ring-track:#3A1F2C;
    --heat:#D9A360;
    --charge:0;
  }
  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{
    margin:0;
    background:var(--ground);
    color:var(--cream);
    font-family:'Outfit',system-ui,-apple-system,sans-serif;
    font-weight:300;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
    overflow-x:hidden;
  }
  button{font-family:inherit;cursor:pointer}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
    outline:2px solid var(--gold);outline-offset:2px;border-radius:4px;
  }
  small{display:block;font-size:12px;color:var(--dim);font-weight:300;margin-top:2px}

  .shell{max-width:520px;margin:0 auto;padding:0 20px 120px;position:relative}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;justify-content:space-between;padding:24px 0 4px;gap:10px}
  .brand{font-family:'Cormorant',Georgia,serif;font-style:italic;font-weight:600;font-size:30px;letter-spacing:.01em;color:var(--cream);line-height:1}
  .brand .amp{color:var(--rose)}
  .header-btns{display:flex;gap:6px;flex:none}
  .ghost-btn{
    background:none;border:1px solid var(--edge);color:var(--dim);
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;
    padding:7px 12px;border-radius:999px;transition:color .2s,border-color .2s;
  }
  .ghost-btn:hover{color:var(--cream);border-color:var(--gold)}

  .heatbar{display:flex;align-items:center;justify-content:space-between;margin:14px 0 22px;gap:12px}
  .heat{display:flex;align-items:center;gap:10px}
  .pips{display:flex;gap:5px;align-items:flex-end}
  .pip{width:9px;height:12px;border-radius:5px 5px 6px 6px;background:var(--edge);transition:background .4s,box-shadow .4s,height .4s}
  .pip:nth-child(2){height:15px}.pip:nth-child(3){height:18px}.pip:nth-child(4){height:21px}
  .pip.on{background:var(--heat);box-shadow:0 0 12px var(--heat)}
  .heat-label{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
  .heat-label b{color:var(--heat);font-weight:600;transition:color .4s}
  .heat-next{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-align:right}

  /* ---------- turn chip ---------- */
  .turn{
    align-self:center;background:var(--surface);border:1px solid var(--edge);color:var(--cream);
    border-radius:999px;padding:8px 16px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;
    display:flex;gap:10px;align-items:center;transition:border-color .2s;
  }
  .turn:hover{border-color:var(--gold)}
  .turn .dot{width:8px;height:8px;border-radius:50%;background:var(--rose)}
  .turn.him .dot{background:var(--gold)}
  .turn small{display:inline;color:var(--dim);letter-spacing:.08em;text-transform:none;font-size:11px;margin:0}

  /* ---------- wheel stage ---------- */
  .stage{position:relative;display:flex;flex-direction:column;align-items:center}
  .wheel-wrap{position:relative;width:min(88vw,420px);aspect-ratio:1;margin-top:22px;user-select:none;-webkit-user-select:none}
  .halo{position:absolute;inset:-14%;border-radius:50%;pointer-events:none;filter:blur(22px);opacity:.9;transition:background 1s}
  .halo.flicker{animation:flicker 3.2s ease-in-out infinite}
  @keyframes flicker{0%,100%{opacity:.75;transform:scale(1)}40%{opacity:1;transform:scale(1.03)}70%{opacity:.85;transform:scale(.99)}}
  #wheel{position:relative;width:100%;height:100%;display:block;border-radius:50%;
    box-shadow:0 0 0 1px var(--edge),0 24px 60px rgba(0,0,0,.55)}
  #sparks{position:absolute;left:-20%;top:-20%;width:140%;height:140%;pointer-events:none;z-index:4}
  .pointer{
    position:absolute;top:-9px;left:50%;transform:translateX(-50%);
    width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;
    border-top:24px solid var(--gold);filter:drop-shadow(0 3px 6px rgba(0,0,0,.6));z-index:3;
  }
  .charge-ring{
    position:absolute;top:50%;left:50%;width:106px;height:106px;transform:translate(-50%,-50%);
    border-radius:50%;z-index:2;pointer-events:none;
    background:conic-gradient(var(--gold-bright) calc(var(--charge) * 360deg), transparent 0);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));
    mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));
  }
  .hub{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:88px;height:88px;border-radius:50%;
    background:var(--surface);border:1px solid var(--gold);
    color:var(--gold);font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;
    display:flex;align-items:center;justify-content:center;z-index:3;
    box-shadow:0 0 24px rgba(217,163,96,.25), inset 0 0 18px rgba(0,0,0,.5);
    transition:transform .12s,box-shadow .3s;
    touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  }
  .hub:disabled{color:var(--dim);border-color:var(--edge);cursor:default;box-shadow:none}
  .hint{margin-top:16px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);text-align:center}
  .rounds{margin-top:8px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .rounds b{color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}

  /* ---------- result card ---------- */
  .card{
    margin-top:26px;width:100%;background:var(--surface);border:1px solid var(--edge);
    border-radius:18px;padding:26px 24px 22px;text-align:center;
    animation:rise .45s cubic-bezier(.2,.9,.3,1);position:relative;overflow:hidden;
  }
  .card.jackpot{border-color:var(--gold);box-shadow:0 0 50px rgba(217,163,96,.25)}
  .card.mystery{border-color:#000;background:#0E0A0E;box-shadow:0 0 50px rgba(0,0,0,.6)}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
  .tag{
    display:inline-block;font-size:10px;letter-spacing:.24em;text-transform:uppercase;font-weight:600;
    padding:5px 12px;border-radius:999px;border:1px solid currentColor;
  }
  .tag.her{color:var(--rose-soft)} .tag.him{color:var(--gold)}
  .tag.both{color:var(--violet)} .tag.wild{color:var(--teal)}
  .tag.mystery{color:var(--dim)} .tag.jackpot{color:var(--gold-bright);background:rgba(217,163,96,.12)}
  .tag.confession{color:#CFA0E0} .tag.dare{color:#F08A6A}
  .tag.spinner{color:var(--dim);border-style:dashed}
  .card h2{font-family:'Cormorant',Georgia,serif;font-weight:600;font-size:30px;line-height:1.15;margin:0 0 10px;text-wrap:balance}
  .card.jackpot.pick h2{color:var(--gold-bright);font-size:44px;letter-spacing:.04em;font-style:italic}
  .card.mystery h2{font-size:54px;color:var(--gold);letter-spacing:.2em}
  .card .note{font-family:'Cormorant',Georgia,serif;font-style:italic;font-size:18px;color:var(--dim);margin:0 0 16px;line-height:1.4}
  .extras{display:flex;flex-direction:column;gap:8px;margin:0 0 18px}
  .twist{
    background:var(--surface-2);border:1px solid var(--ember);color:var(--cream);border-radius:12px;padding:10px 14px;
    font-size:14px;animation:flip .55s cubic-bezier(.2,.9,.3,1);transform-origin:top;
  }
  .twist b{color:var(--ember);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:10px;display:block;margin-bottom:3px}
  @keyframes flip{from{opacity:0;transform:perspective(500px) rotateX(-70deg)}to{opacity:1;transform:none}}
  .focus{font-size:13px;color:var(--dim);letter-spacing:.06em}
  .focus b{color:var(--gold);font-weight:500}
  .card .clock-line{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:20px}
  .card .clock-line b{color:var(--cream);font-family:'DM Mono',monospace;font-variant-numeric:tabular-nums;font-weight:500;letter-spacing:.05em}
  .card-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .card select{
    width:100%;background:var(--surface-2);border:1px solid var(--edge);color:var(--cream);
    border-radius:10px;padding:12px 13px;font-family:inherit;font-size:14px;margin-bottom:16px;
  }
  .primary-btn{
    background:var(--rose);color:#2A0A14;border:none;border-radius:999px;
    font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
    padding:14px 26px;transition:transform .15s,box-shadow .2s;
    box-shadow:0 6px 24px rgba(228,88,122,.35);
  }
  .primary-btn:hover{transform:translateY(-1px)}
  .primary-btn.gold{background:var(--gold);box-shadow:0 6px 24px rgba(217,163,96,.35)}
  .quiet-btn{
    background:none;border:1px solid var(--edge);color:var(--dim);border-radius:999px;
    font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;padding:14px 22px;
    transition:color .2s,border-color .2s;
  }
  .quiet-btn:hover{color:var(--cream);border-color:var(--dim)}
  .veto-note{margin-top:14px;color:var(--dim);font-style:italic;font-family:'Cormorant',Georgia,serif;font-size:15px;text-align:center}

  /* ---------- timer overlay ---------- */
  .overlay{
    position:fixed;inset:0;background:var(--ground);z-index:40;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;text-align:center;overflow-y:auto;
  }
  .overlay.flash{animation:flash .6s ease-out}
  @keyframes flash{0%{background:#5A1A2C}100%{background:var(--ground)}}
  .t-label{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:10px}
  .t-name{font-family:'Cormorant',Georgia,serif;font-weight:600;font-size:30px;margin:0 0 14px;max-width:440px;text-wrap:balance;line-height:1.15}
  .t-extras{display:flex;flex-direction:column;gap:6px;margin-bottom:22px;max-width:380px}
  .ring-wrap{position:relative;width:min(70vw,300px);aspect-ratio:1;flex:none}
  .ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring-track{fill:none;stroke:var(--ring-track);stroke-width:6}
  .ring-fill{fill:none;stroke:var(--gold);stroke-width:6;stroke-linecap:round;transition:stroke .4s}
  .ring-wrap.hot .ring-fill{stroke:var(--rose)}
  .ring-wrap.veiled .ring-fill{stroke-dasharray:6 14 !important;stroke-dashoffset:0 !important;animation:crawl 2.4s linear infinite;stroke:var(--dim)}
  @keyframes crawl{to{stroke-dashoffset:-40}}
  .t-digits{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:'DM Mono',monospace;font-variant-numeric:tabular-nums;
  }
  .t-digits .big{font-size:56px;font-weight:500;letter-spacing:.02em}
  .t-digits .veil{font-family:'Cormorant',Georgia,serif;font-style:italic;font-size:22px;color:var(--dim);max-width:180px;line-height:1.3}
  .ring-wrap.hot .big{color:var(--rose);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.55}}
  .t-hint{margin-top:24px;font-family:'Cormorant',Georgia,serif;font-style:italic;font-size:18px;color:var(--dim);max-width:340px;line-height:1.4}
  .t-end{margin-top:26px}
  .stopped{max-width:420px}
  .stopped h1{font-family:'Cormorant',Georgia,serif;font-style:italic;font-weight:600;font-size:60px;color:var(--rose);margin:0 0 8px;animation:pulse 1.2s infinite}
  .stopped p{color:var(--dim);font-size:15px;margin:0 0 26px}
  .heat-up{
    background:var(--surface);border:1px solid var(--heat);border-radius:14px;padding:14px 18px;margin:0 0 24px;
    box-shadow:0 0 40px rgba(232,100,60,.2);animation:rise .5s;
  }
  .heat-up b{display:block;color:var(--heat);font-size:11px;letter-spacing:.28em;text-transform:uppercase;margin-bottom:4px}
  .heat-up span{font-family:'Cormorant',Georgia,serif;font-size:20px;font-style:italic}
  .gamble{background:var(--surface);border:1px solid var(--edge);border-radius:16px;padding:20px;margin-bottom:8px;animation:rise .5s}
  .gamble h3{font-family:'Cormorant',Georgia,serif;font-style:italic;font-weight:600;font-size:28px;margin:0 0 6px;color:var(--gold)}
  .gamble p{margin:0 0 16px;font-size:14px;color:var(--dim)}
  .coin{width:92px;height:92px;margin:6px auto 18px;position:relative;transform-style:preserve-3d;transition:transform 1.7s cubic-bezier(.2,.8,.2,1)}
  .coin .face{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-family:'Cormorant',Georgia,serif;font-weight:700;font-size:20px;letter-spacing:.1em;border:2px solid rgba(0,0,0,.3)}
  .coin .front{background:var(--gold);color:#2A0A14}
  .coin .back{background:var(--rose);color:#2A0A14;transform:rotateY(180deg)}
  .result{font-family:'Cormorant',Georgia,serif;font-style:italic;font-size:22px;margin:0 0 16px;min-height:1.4em}

  /* ---------- plot-twist banner ---------- */
  .banner{
    position:fixed;left:50%;top:16px;transform:translateX(-50%) translateY(-160%);
    transition:transform .45s cubic-bezier(.2,.9,.3,1);z-index:80;
    background:var(--ember);color:#1A0806;padding:14px 20px;border-radius:14px;max-width:min(92vw,440px);text-align:center;
    box-shadow:0 12px 40px rgba(0,0,0,.5);
  }
  .banner.show{transform:translateX(-50%) translateY(0)}
  .banner b{display:block;font-size:10px;letter-spacing:.3em;text-transform:uppercase;margin-bottom:4px;font-weight:700}
  .banner span{font-family:'Cormorant',Georgia,serif;font-weight:700;font-size:22px;line-height:1.2}

  /* ---------- gate & rules ---------- */
  .gate{z-index:60}
  .gate-inner{max-width:400px}
  .gate h1{font-family:'Cormorant',Georgia,serif;font-style:italic;font-weight:600;font-size:46px;margin:0 0 4px}
  .gate .amp{color:var(--rose)}
  .gate .sub{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);margin:0 0 30px}
  .rules{list-style:none;margin:0 0 32px;padding:0;text-align:left;display:flex;flex-direction:column;gap:13px}
  .rules li{display:flex;gap:14px;align-items:baseline;font-size:15px;line-height:1.45;color:var(--cream)}
  .rules .r-mark{color:var(--gold);font-family:'Cormorant',Georgia,serif;font-style:italic;flex:none;min-width:22px}
  .rules em{color:var(--rose-soft);font-style:normal;font-weight:500}

  /* ---------- finish / night report ---------- */
  .finish{z-index:50}
  #confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .finish-inner{position:relative;max-width:440px;width:100%}
  .finish h1{font-family:'Cormorant',Georgia,serif;font-style:italic;font-weight:600;font-size:44px;margin:0 0 6px;color:var(--gold)}
  .finish .lede{color:var(--dim);font-size:15px;margin:0 0 22px;line-height:1.5}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left;margin-bottom:16px}
  .stat{background:var(--surface);border:1px solid var(--edge);border-radius:12px;padding:12px 14px}
  .stat b{display:block;font-family:'DM Mono',monospace;font-size:22px;color:var(--gold);font-weight:500;font-variant-numeric:tabular-nums}
  .stat span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  .aftercare{background:var(--surface);border:1px solid var(--edge);border-radius:14px;padding:16px 18px;margin-bottom:22px;text-align:left}
  .aftercare b{display:block;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--rose-soft);margin-bottom:6px}
  .aftercare p{margin:0;font-family:'Cormorant',Georgia,serif;font-size:19px;font-style:italic;line-height:1.4}

  /* ---------- settings drawer ---------- */
  .drawer{position:fixed;inset:0;z-index:55;background:rgba(12,5,9,.72);display:flex;justify-content:flex-end}
  .drawer-panel{
    width:min(94vw,440px);height:100%;background:var(--surface);border-left:1px solid var(--edge);
    padding:22px 20px 60px;overflow-y:auto;animation:slide .3s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
  .drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
  .drawer-head h2{font-family:'Cormorant',Georgia,serif;font-style:italic;font-weight:600;font-size:26px;margin:0}
  .drawer-sub{font-size:12px;color:var(--dim);margin:0 0 6px;line-height:1.5}
  .sec-title{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin:26px 0 10px;font-weight:600}
  .seg{display:flex;border:1px solid var(--edge);border-radius:999px;overflow:hidden}
  .seg button{flex:1;background:none;border:none;color:var(--dim);padding:10px 4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:500}
  .seg button.on{background:var(--rose);color:#2A0A14;font-weight:600}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
  .field label{font-size:12px;color:var(--dim);letter-spacing:.06em}
  .drawer input[type=text],.drawer input[type=number],.drawer select,.drawer textarea{
    background:var(--surface-2);border:1px solid var(--edge);color:var(--cream);
    border-radius:10px;padding:11px 13px;font-family:inherit;font-size:14px;width:100%;
  }
  .drawer textarea{min-height:76px;resize:vertical;line-height:1.4}
  .duo{display:flex;gap:10px}
  .tog{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--edge);font-size:14px;cursor:pointer}
  .tog b{font-weight:500}
  .tog input{accent-color:var(--rose);width:18px;height:18px;flex:none}
  .act-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--edge)}
  .act-row label{flex:1;font-size:14px;display:flex;align-items:center;gap:12px;cursor:pointer;line-height:1.3}
  .act-row input[type=checkbox]{accent-color:var(--rose);width:17px;height:17px;flex:none}
  .act-row .meta{font-family:'DM Mono',monospace;font-size:11px;color:var(--dim);flex:none;font-variant-numeric:tabular-nums;text-align:right;line-height:1.5}
  .act-row .meta i{font-style:normal;color:var(--ember);letter-spacing:-2px}
  .act-row .del{background:none;border:none;color:var(--dim);font-size:16px;padding:4px 6px}
  .act-row .del:hover{color:var(--rose)}
  .off label{color:var(--dim);text-decoration:line-through;text-decoration-color:rgba(169,132,146,.5)}
  .add-form{margin-top:14px;display:flex;flex-direction:column;gap:10px}
  .drawer-foot{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}

  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--surface-2);border:1px solid var(--edge);color:var(--cream);padding:12px 18px;border-radius:999px;
    font-size:13px;z-index:90;transition:transform .3s,opacity .3s;pointer-events:none;max-width:90vw;text-align:center;
  }
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}

  /* ---------- limits sheet / dominion ---------- */
  .power-row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;justify-content:center}
  .power-row .quiet-btn{padding:11px 18px;font-size:12px}
  .power-row .quiet-btn.crown{border-color:#5A1424;color:#F08CA5}
  .tag.dominion{color:#FF6B85;background:rgba(255,59,92,.1)}
  .sheet{max-width:520px;width:100%;text-align:left}
  .sheet h1{font-family:'Cormorant',Georgia,serif;font-style:italic;font-weight:600;font-size:40px;margin:0 0 6px;text-align:center}
  .sheet .lede{color:var(--dim);font-size:14px;line-height:1.55;margin:0 0 22px;text-align:center}
  .sheet-pass{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:28px 0 4px}
  .sheet-pass-sub{font-family:'Cormorant',Georgia,serif;font-style:italic;font-size:22px;margin:0 0 10px}
  .cat{margin:18px 0 4px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .cat h3{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--rose-soft);margin:0;font-weight:600}
  .cat .quick{display:flex;gap:4px}

    var p={kind:opts.hidden?'mystery':'act',act:a,name:a.name,note:a.note||'',tag:a.tag,hidden:!!opts.hidden,twist:null,focus:null,toy:null,jackpot:!!opts.jackpot};
    if(settings.twists && !opts.jackpot && Math.random()<.35){ p.twist=pick(TWISTS); stats.twists++; }
    if(a.zones) p.focus=pick(ZONES);
    if(a.toy && settings.toys.length) p.toy=pick(settings.toys);
    p.sec=rollSec(a.min,a.max,(p.twist&&p.twist.mult||1)*(opts.jackpot?2:1));
    return p;

  function land(s,spinner){
    var p;

    if(s.kind==='act'){ p=buildFromAct(s.act); }
    else if(s.kind==='mystery'){ p=buildFromAct(pick(eligibleActs()),{hidden:true}); }
    else if(s.kind==='confession'){ p={kind:'confession',name:pick(CONFESSIONS),tag:'confession',note:pronoun(spinner)+' answers first — honestly. The other gets two follow-up questions, then answers the same one.',sec:rollSec(1.5,3,1)}; }
    else if(s.kind==='dare'){ var d=pick(DARES); p={kind:'dare',name:d.t,tag:'dare',note:pronoun(spinner)+' performs. The bell does not negotiate.',sec:rollSec(d.min,d.max,1)}; }
    else if(s.kind==='jackpot'){ stats.jackpots++; fanfare(); p={kind:'jackpot',name:'Jackpot',tag:'jackpot',note:pronoun(spinner)+' picks anything on the whole menu — every heat level unlocked — and the bell gives double time.'}; }

  /* ---------- timer ---------- */
  var timerEl=null, timerInt=null;
  var RING_R=46, CIRC=2*Math.PI*RING_R;
  function startTimer(p,opts){
    opts=opts||{};
    var total=p.sec, left=total, veiled=settings.mysteryTimer && !opts.overtime;
    clearResult();
    timerEl=el('div','overlay');
    if(opts.overtime) timerEl.appendChild(el('div','t-label',opts.penalty?'Forfeit · 60 seconds':'Overtime · 60 seconds'));
    else if(p.jackpot) timerEl.appendChild(el('div','t-label','Jackpot round · double time'));
    else if(p.hidden) timerEl.appendChild(el('div','t-label','Mystery revealed'));
    var chips=el('div','chips'); chips.appendChild(el('span','tag '+p.tag,TAGS[p.tag]||p.tag)); timerEl.appendChild(chips);
    timerEl.appendChild(el('h2','t-name',p.name));
    var ex=el('div','t-extras');
    if(p.twist){ var tw=el('div','twist'); tw.appendChild(el('b',null,'Twist')); tw.appendChild(document.createTextNode(p.twist.t)); ex.appendChild(tw); }
    if(p.focus){ var f=el('p','focus'); f.appendChild(document.createTextNode('Focus: ')); f.appendChild(el('b',null,p.focus)); ex.appendChild(f); }
    if(p.toy){ var ty=el('p','focus'); ty.appendChild(document.createTextNode('From the drawer: ')); ty.appendChild(el('b',null,p.toy)); ex.appendChild(ty); }
    if(ex.childNodes.length) timerEl.appendChild(ex);

    var ring=el('div','ring-wrap'+(veiled?' veiled':'')); ring.id='ringWrap';
    ring.innerHTML='<svg viewBox="0 0 100 100" aria-hidden="true"><circle class="ring-track" cx="50" cy="50" r="'+RING_R+'"/><circle class="ring-fill" id="ringFill" cx="50" cy="50" r="'+RING_R+'" stroke-dasharray="'+CIRC+'" stroke-dashoffset="0"/></svg>';
    var digits=el('div','t-digits');
    if(veiled) digits.appendChild(el('span','veil','the bell knows'));
    else { var big=el('span','big',fmt(left)); big.id='digits'; digits.appendChild(big); }
    ring.appendChild(digits); timerEl.appendChild(ring);
    timerEl.appendChild(el('p','t-hint',opts.penalty?'Hands behind your backs. Words only. Make them count.':'When the bell rings, everything stops. Everything.'));
    var endBtn=el('button','quiet-btn t-end','Stop early'); endBtn.addEventListener('click',function(){ closeTimer(); });
    timerEl.appendChild(endBtn);
    document.body.appendChild(timerEl);

    var startedAt=Date.now(), endAt=startedAt+left*1000, lastShown=left;
    var plotAt=(settings.plot && !opts.overtime && total>=90 && Math.random()<.3) ? total*(.3+Math.random()*.4) : -1, plotDone=false;
    timerInt=setInterval(function(){
      var now=Date.now(); left=Math.max(0,Math.round((endAt-now)/1000));
      var elapsed=(now-startedAt)/1000;
      if(plotAt>0 && !plotDone && elapsed>=plotAt){ plotDone=true; stats.plot++; save(); showBanner(pick(PLOT)); }
      if(left!==lastShown){
        lastShown=left;
        var dg=document.getElementById('digits'); if(dg) dg.textContent=fmt(left);
        if(!veiled){ var rf=document.getElementById('ringFill'); if(rf) rf.setAttribute('stroke-dashoffset',String(CIRC*(1-left/total))); }
        if(left<=10){ ring.classList.add('hot'); if(veiled){ ring.classList.remove('veiled'); var v=digits.querySelector('.veil'); if(v) v.textContent='soon'; } }
        if(left<=10 && left>0) heartbeat();
      }
      if(left<=0) bellStop(p,total,opts);
    },200);
  }

  function bellStop(p,total,opts){
    clearInterval(timerInt); timerInt=null;
    bell(); vibrate([120,80,120,80,240]);
    timerEl.classList.add('flash');
    var before=tier();
    if(!opts.penalty){ stats.seconds+=total; if(!opts.overtime){ stats.rounds++; stats.longest=Math.max(stats.longest,total); } }
    var after=tier(); stats.peakHeat=Math.max(stats.peakHeat,after); save(); updateHeatUI(); draw();

    timerEl.innerHTML='';
    var box=el('div','stopped');
    box.appendChild(el('h1',null,'Stop.'));
    box.appendChild(el('p',null,opts.penalty?'Forfeit served. Back to the wheel — and no, that didn’t count as a round.':'The bell has spoken. Hands where the wheel can see them.'));
    if(after>before){
      var hu=el('div','heat-up'); hu.appendChild(el('b',null,'🔥 Heat rising — '+HEAT_NAMES[after]+' unlocked'));
      var added=sliceCount(after)-sliceCount(before);
      hu.appendChild(el('span',null,added>0?added+' new slice'+(added===1?'':'s')+' just landed on the wheel.':'The wheel is getting ideas.'));
      box.appendChild(hu);
    }

    if(offer){
      var g=el('div','gamble');
      g.appendChild(el('h3',null,'Double or nothing?'));
      g.appendChild(el('p',null,'Flip the coin. Win: sixty seconds of overtime, same round. Lose: sixty seconds of talk only, hands behind your backs.'));
      var coin=el('div','coin'); coin.appendChild(el('div','face front','MORE')); coin.appendChild(el('div','face back','TALK')); g.appendChild(coin);
      var res=el('p','result',''); g.appendChild(res);
      var gb=el('div','card-btns');
      var flip=el('button','primary-btn gold','Flip the coin'), take=el('button','quiet-btn','Take the bell');
      gb.appendChild(flip); gb.appendChild(take); g.appendChild(gb);
      flip.addEventListener('click',function(){
        flip.disabled=true; take.disabled=true; stats.gambles++;
        var win=Math.random()<.5; sting();
        coin.style.transform='rotateY('+(1800+(win?0:180))+'deg)';
        setTimeout(function(){
          gb.innerHTML='';
          if(win){
            stats.gWon++; save(); fanfare(); res.textContent='MORE. Sixty seconds. Go.';
            var go=el('button','primary-btn gold','Start overtime');
            go.addEventListener('click',function(){ closeTimer(); startTimer({kind:p.kind,name:p.name,tag:p.tag,note:'',twist:p.twist,focus:p.focus,toy:p.toy,sec:60},{overtime:true}); });
            gb.appendChild(go);
          } else {

            var tk=el('button','primary-btn','Serve the forfeit');
            tk.addEventListener('click',function(){ closeTimer(); startTimer({kind:'penalty',name:'Talk only — tell them exactly what you would be doing right now. In detail.',tag:'wild',note:'',sec:60},{overtime:true,penalty:true}); });
            gb.appendChild(tk);
          }
        },reduced?50:1750);
      });
      take.addEventListener('click',function(){ closeTimer(); });
      box.appendChild(g);
    } else {
      var back=el('button','primary-btn','Back to the wheel'); back.addEventListener('click',function(){ closeTimer(); }); box.appendChild(back);
    }
    timerEl.appendChild(box);
  }

  function confetti(cv){
    var c=cv.getContext('2d'), W=cv.width=cv.clientWidth, H=cv.height=cv.clientHeight, run=true;
    var COLS=['#E4587A','#D9A360','#F0DFE2','#B07BD6','#F2C57C'];
    var ps=[]; for(var i=0;i<140;i++) ps.push({x:Math.random()*W,y:-Math.random()*H,r:3+Math.random()*5,vy:1.5+Math.random()*2.5,vx:-1+Math.random()*2,rot:Math.random()*6,vr:-.1+Math.random()*.2,col:COLS[i%COLS.length]});
    (function loop(){
      if(!run) return; c.clearRect(0,0,W,H);
      ps.forEach(function(p){ p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; if(p.y>H+10){p.y=-10;p.x=Math.random()*W;}
        c.save(); c.translate(p.x,p.y); c.rotate(p.rot); c.fillStyle=p.col; c.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6); c.restore(); });
      requestAnimationFrame(loop);
    })();
    return function(){run=false;};
  }

        var lo=Math.max(1,parseInt(mn.value,10)||3), hi=Math.max(lo,parseInt(mx.value,10)||6);
        acts.push({id:'c'+Date.now(),name:name.value.trim(),wheel:wheel.value.trim()||name.value.trim().slice(0,14),tag:tag.value,heat:parseInt(heat.value,10)||1,min:lo,max:hi,note:'House special.',on:true});
        save(); draw(); updateHeatUI(); render(); panel.scrollTop=panel.scrollHeight;
      });
      panel.appendChild(form);

      var foot=el('div','drawer-foot');
      var reset=el('button','quiet-btn','Reset to house menu'); reset.addEventListener('click',function(){ acts=defaults(); save(); draw(); updateHeatUI(); render(); toast('House menu restored.'); });
      foot.appendChild(reset); panel.appendChild(foot);
    }
    render();
    d.addEventListener('click',function(ev){ if(ev.target===d) d.remove(); });
    document.body.appendChild(d);
  }


  /* ---------- limits sheet: answers & gating ---------- */
  var KINK_BY={}; KINKS.forEach(function(k){ KINK_BY[k.id]=k; });
  function other(w){ return w==='her'?'him':'her'; }
  function nameOf(w){ return w==='her'?(settings.her==='Her'?'Her':settings.her):(settings.him==='Him'?'Him':settings.him); }
  function ans(person,dir,k){ var v=sheet[person][dir][k]; if(v==null){ var item=KINK_BY[k]; return item?(item.def||null):null; } return v; }
  /* an act done to `recv` is allowed when the receiver accepts it AND the other wants to do it */
  function pair(k,recv,strict){
    var giver=other(recv), r=ans(recv,'recv',k), g=ans(giver,'give',k);
    var okv=strict?['yes']:['yes','maybe'];
    if(okv.indexOf(r)<0||okv.indexOf(g)<0) return {ok:false};
    return {ok:true,maybe:r==='maybe'||g==='maybe'};
  }
  /* needs: array of [kinkId, recv] where recv is 'her' | 'him' | 'any' */
  function needsOk(needs,strict){
    var maybe=false;
    for(var i=0;i<(needs||[]).length;i++){
      var k=needs[i][0], who=needs[i][1], p;
      if(who==='any'){ var a=pair(k,'her',strict), b=pair(k,'him',strict); if(!a.ok&&!b.ok) return {ok:false}; p=a.ok?a:b; }
      else { p=pair(k,who,strict); if(!p.ok) return {ok:false}; }
      if(p.maybe) maybe=true;
    }
    return {ok:true,maybe:maybe};
  }
  function actAllowed(a){ return !a.needs || needsOk(a.needs,false).ok; }
  function sheetReady(){ return !!(sheet.her.done&&sheet.him.done); }

  function showLimits(){
    var o=el('div','overlay gate'); var box=el('div','sheet');
    box.appendChild(el('h1',null,'The Limits Sheet'));
    box.appendChild(el('p','lede','Each of you answers alone — what may be done to you, and what you’d do to them. Then the phone shows only the overlap: the things you both said yes (or maybe) to. If it isn’t on the overlap, it doesn’t exist tonight, and nobody has to explain why.'));
    var st=el('div','gather'); st.appendChild(el('b',null,'Status'));
    st.appendChild(document.createTextNode(nameOf('her')+': '+(sheet.her.done?'answered':'not yet')+' · '+nameOf('him')+': '+(sheet.him.done?'answered':'not yet')+'. '+(sheetReady()?'The wheel and the scenes follow your overlap.':'Until both of you answer, the house defaults apply.')));
    box.appendChild(st);
    var btns=el('div','card-btns'); btns.style.flexDirection='column';
    ['her','him'].forEach(function(w){
      var b=el('button',sheet[w].done?'quiet-btn':'primary-btn',(sheet[w].done?'Edit ':'')+nameOf(w)+'’s answers');
      b.addEventListener('click',function(){ o.remove(); handoff(w,function(){ sheetFor(w,function(){ if(sheetReady()) showOverlap(); else showLimits(); }); }); });
      btns.appendChild(b);
    });
    if(sheetReady()){ var v=el('button','primary-btn gold','View the overlap'); v.addEventListener('click',function(){ o.remove(); showOverlap(); }); btns.appendChild(v); }
    var reset=el('button','quiet-btn','Reset the whole sheet'), armed=false;
    reset.addEventListener('click',function(){ if(!armed){ armed=true; reset.textContent='Tap again to wipe both sets of answers'; return; } sheet=defSheet(); save(); draw(); o.remove(); toast('Sheet wiped. House defaults apply.'); });
    btns.appendChild(reset);
    var close=el('button','quiet-btn','Back to the wheel'); close.addEventListener('click',function(){ o.remove(); }); btns.appendChild(close);
    box.appendChild(btns); o.appendChild(box); document.body.appendChild(o);
  }
  function handoff(w,then){
    var o=el('div','overlay gate'); var box=el('div','handoff');
    box.appendChild(el('h1',null,'Hand the phone to '+nameOf(w)+'.'));
    box.appendChild(el('p',null,nameOf(other(w))+', eyes elsewhere. Nothing '+nameOf(w)+' answers will ever be shown to you — only what you both agree on.'));
    var b=el('button','primary-btn','I’m '+nameOf(w)+' — begin'); b.addEventListener('click',function(){ o.remove(); then(); });
    box.appendChild(b); o.appendChild(box); document.body.appendChild(o);
  }
  function sheetFor(w,then){
    var o=el('div','overlay gate'); o.style.justifyContent='flex-start'; var box=el('div','sheet');
    var me=sheet[w], oth=other(w);
    box.appendChild(el('h1',null,nameOf(w)+'’s sheet'));
    box.appendChild(el('p','lede','Yes = bring it. Maybe = I’m curious, check in first. No = not tonight, not up for discussion. Unanswered counts as No. Everything here can change any night.'));
    function pass(dir,title,subtitle){
      box.appendChild(el('div','sheet-pass',title)); box.appendChild(el('p','sheet-pass-sub',subtitle));
      var recvPerson=dir==='recv'?w:oth;
      KCATS.forEach(function(cat){
        var items=KINKS.filter(function(k){ return k.cat===cat && k.recv.indexOf(recvPerson)>=0; });
        if(!items.length) return;
        var head=el('div','cat'); head.appendChild(el('h3',null,cat));
        var quick=el('div','quick'), painters=[];
        ['yes','maybe','no'].forEach(function(v){ var qb=el('button',null,'all '+v); qb.type='button'; qb.addEventListener('click',function(){ items.forEach(function(k){ if(!k.locked) me[dir][k.id]=v; }); save(); painters.forEach(function(fn){fn();}); }); quick.appendChild(qb); });
        head.appendChild(quick); box.appendChild(head);
        items.forEach(function(k){
          var row=el('div','kink'), kl=el('div','kl'); kl.appendChild(el('b',null,k.label));
          if(k.desc) kl.appendChild(el('small',null,k.desc));
          if(k.note) kl.appendChild(el('small','risk',k.note));
          if(k.locked) kl.appendChild(el('small','lock','House rule. Prefilled No — change it only if you both mean it.'));
          row.appendChild(kl);
          var tri=el('div','tri'), bs={};
          ['yes','maybe','no'].forEach(function(v){ var b=el('button',v,v); b.type='button'; b.addEventListener('click',function(){ me[dir][k.id]=v; save(); paint(); }); tri.appendChild(b); bs[v]=b; });
          function paint(){ var cur=ans(w,dir,k.id); ['yes','maybe','no'].forEach(function(v){ bs[v].className=v+(cur===v?' on':''); bs[v].setAttribute('aria-pressed',cur===v?'true':'false'); }); }
          paint(); painters.push(paint); row.appendChild(tri); box.appendChild(row);
        });
      });
    }
    pass('recv','Part one · done to me','What '+nameOf(oth)+' may do to my body.');
    pass('give','Part two · I’d do this to '+nameOf(oth),'What I want to do to '+(oth==='her'?'her':'him')+' when I hold the power.');
    var foot=el('div','sheet-foot');
    var lock=el('button','primary-btn','Lock my answers'); lock.addEventListener('click',function(){ me.done=true; save(); draw(); updateHeatUI(); o.remove(); then(); });
    foot.appendChild(lock); foot.appendChild(el('small',null,'Locking hides this screen. You can edit any time from the Limits button.'));
    box.appendChild(foot); o.appendChild(box); document.body.appendChild(o); o.scrollTop=0;
  }
  function showOverlap(){
    var o=el('div','overlay gate'); o.style.justifyContent='flex-start'; var box=el('div','sheet overlap');
    box.appendChild(el('h1',null,'The overlap'));
    box.appendChild(el('p','lede','Only mutual yeses and maybes appear. Anything either of you said no to is simply not here — and never will be.'));
    [['him','her'],['her','him']].forEach(function(d){
      var giver=d[0], recv=d[1], yes=[], maybe=[];
      box.appendChild(el('h2',null,nameOf(giver)+' → '+nameOf(recv)));
      KINKS.forEach(function(k){ if(k.recv.indexOf(recv)<0) return; var p=pair(k.id,recv,false); if(!p.ok) return; (p.maybe?maybe:yes).push(k); });
      if(!yes.length&&!maybe.length) box.appendChild(el('p','o-empty','Nothing yet. That’s an answer too.'));
      function list(arr,cls,label){ if(!arr.length) return; box.appendChild(el('div','o-sub',label)); arr.forEach(function(k){ var r=el('div','o-item'), l=el('div'); l.appendChild(document.createTextNode(k.label)); if(k.note) l.appendChild(el('small','risk',k.note)); r.appendChild(l); r.appendChild(el('span','st '+cls,cls==='yes'?'yes · yes':'talk first')); box.appendChild(r); }); }
      list(yes,'yes','Both said yes'); list(maybe,'maybe','One of you said maybe — check in before it happens');
      if(pair('breath',recv,false).ok){ var s=el('div','safety'); s.appendChild(el('b',null,'Breath play — read this together')); s.appendChild(document.createTextNode(KINK_BY.breath.note)); box.appendChild(s); }
    });
    var b=el('button','primary-btn','Take it to the wheel'); b.style.marginTop='24px'; b.addEventListener('click',function(){ o.remove(); draw(); updateHeatUI(); });
    box.appendChild(b); o.appendChild(box); document.body.appendChild(o);
  }

  /* ---------- dominion: setup, build, run ---------- */
  function showSceneSetup(){
    clearResult();
    var o=el('div','overlay gate'); var box=el('div','setup');
    box.appendChild(el('h1',null,'Dominion'));
    box.appendChild(el('p','lede','One of you holds the power. The other follows. The one in charge follows the script — every step, in order, for as long as the bell says. Yellow pauses everything. Red ends it, instantly. '+(sheetReady()?'Built only from your Limits Sheet overlap.':'You haven’t both filled the Limits Sheet, so the house defaults apply — fill it for the full menu.')));
    var dom=null, len=5, inten='firm', begin;
    box.appendChild(el('h3','sec-title','Who holds the power?'));
    var who=el('div','who'), wb={};
    ['her','him'].forEach(function(w){ var b=el('button',null,nameOf(w)+' dominates'); b.addEventListener('click',function(){ dom=w; paintWho(); }); who.appendChild(b); wb[w]=b; });
    var coin=el('button',null,'Coin decides'); coin.addEventListener('click',function(){ dom=Math.random()<.5?'her':'him'; sting(); paintWho(); toast('The coin says: '+nameOf(dom)+'.'); }); who.appendChild(coin);
    function paintWho(){ ['her','him'].forEach(function(w){ wb[w].className=dom===w?'on':''; }); begin.disabled=!dom; }
    box.appendChild(who);
    function segment(opts,cur,onpick){ var seg=el('div','seg'); opts.forEach(function(m){ var b=el('button',cur===m[0]?'on':'',m[1]); b.addEventListener('click',function(){ onpick(m[0]); Array.prototype.forEach.call(seg.children,function(c){c.className='';}); b.className='on'; }); seg.appendChild(b); }); return seg; }
    box.appendChild(el('h3','sec-title','How long'));
    box.appendChild(segment([[3,'Short · 3'],[5,'Full · 5'],[7,'Long · 7']],len,function(v){len=v;}));
    box.appendChild(el('h3','sec-title','How hard'));
    box.appendChild(segment([['soft','Soft'],['firm','Firm'],['ruthless','Ruthless']],inten,function(v){inten=v;}));
    box.appendChild(el('small',null,'Soft skips the intense steps. Firm allows them when you both said yes. Ruthless prefers them.'));
    var btns=el('div','card-btns'); btns.style.marginTop='22px';
    begin=el('button','primary-btn','Build the scene'); begin.disabled=true;
    begin.addEventListener('click',function(){ var steps=buildScene(dom,len,inten); o.remove(); showGather(dom,steps); });
    var back=el('button','quiet-btn','Not tonight'); back.addEventListener('click',function(){ o.remove(); });
    btns.appendChild(begin); btns.appendChild(back); box.appendChild(btns);
    o.appendChild(box); document.body.appendChild(o);
  }
  function stepOk(s,sub,inten){
    var chk=needsOk((s.needs||[]).map(function(n){ return [n[0], n[1]||sub]; }),!!s.intense);
    if(!chk.ok) return null;
    if(s.intense&&inten==='soft') return null;
    return {step:s,maybe:chk.maybe};
  }
  function buildScene(dom,len,inten){
    var sub=other(dom);
    function take(phase,n){
      var p=STEPS.filter(function(s){ return s.dom===dom&&s.phase===phase; }).map(function(s){ return stepOk(s,sub,inten); }).filter(Boolean);
      p.forEach(function(x){ x.score=Math.random()+(x.step.intense&&inten==='ruthless'?2:0)-((x.step.needs||[]).length?0:5); });
      p.sort(function(a,b){ return b.score-a.score; });
      return p.slice(0,n);
    }
    return [].concat(take('open',1),take('build',Math.max(1,len-2)),take('peak',1),take('close',1));
  }
  function showGather(dom,steps){
    var o=el('div','overlay gate'); var box=el('div','setup');
    box.appendChild(el('h1',null,nameOf(dom)+' holds the power.'));
    box.appendChild(el('p','lede',steps.length+' steps, sealed. '+nameOf(dom)+' sees each one only when it begins and may not skip ahead. '+nameOf(other(dom))+' can veto any step, call Yellow to pause, or call Red to end it — at any moment, for any reason.'));
    var props={}, ties=false;
    steps.forEach(function(s){ (s.step.props||[]).forEach(function(p){ props[p]=1; if(/tie/.test(p)) ties=true; }); });
    var list=Object.keys(props); if(ties) list.push('safety shears'); list.push('water');
    var g=el('div','gather'); g.appendChild(el('b',null,'Have within reach')); g.appendChild(document.createTextNode(list.join(' · '))); box.appendChild(g);
    var s=el('div','safety'); s.appendChild(el('b',null,'Before the first knot'));
    s.appendChild(document.createTextNode('Two fingers under every tie, nothing around the neck, hands and feet checked for warmth every few minutes. Agree the signals out loud now: Yellow pauses, Red stops, and two taps means “lift” whenever a mouth is busy.'));
    box.appendChild(s);
    var b=el('button','primary-btn','Begin — hand the phone to '+nameOf(dom)); b.addEventListener('click',function(){ o.remove(); runScene(dom,steps); });
    box.appendChild(b); o.appendChild(box); document.body.appendChild(o);
  }
  var sceneEl=null, sceneInt=null;
  function runScene(dom,steps){
    var sub=other(dom), i=0, paused=false;
    stats.scenes++; if(dom==='her') stats.scenesHer++; else stats.scenesHim++; save();
    sceneEl=el('div','overlay scene'); document.body.appendChild(sceneEl);
    var PHASES={open:'Opening',build:'Building',peak:'The peak',close:'Aftercare'};
    function stopInt(){ if(sceneInt){ clearInterval(sceneInt); sceneInt=null; } }
    function endScene(reason){
      stopInt(); sceneEl.innerHTML=''; sceneEl.classList.remove('scene');
      var a=el('div','after');
      a.appendChild(el('h1',null,reason==='red'?'Red. Scene over.':'Scene complete.'));
      a.appendChild(el('p','lede',reason==='red'?'No questions, no explanations, no apologies. '+nameOf(dom)+': untie first, talk later.':'The power goes back in the drawer. Aftercare is not optional — it is the last step.'));
      var ul=el('ul');
      ['Untie everything now, checking each wrist and ankle as you go.','Water for both of you. Something sweet if you have it.','Skin to skin for five minutes. No phones after this one.',nameOf(dom)+' says three things they loved.',nameOf(sub)+' says how they feel — one word first, then as many as they want.'].forEach(function(t){ ul.appendChild(el('li',null,t)); });
      a.appendChild(ul);
      var b=el('button','primary-btn','Back to the wheel'); b.addEventListener('click',function(){ sceneEl.remove(); sceneEl=null; updateHeatUI(); });
      a.appendChild(b); sceneEl.appendChild(a);
      if(reason!=='red') bell();
    }
    function replacement(cur){
      var used={}; steps.forEach(function(x){ used[x.step.id]=1; });
      var cands=STEPS.filter(function(s){ return s.dom===dom&&s.phase===cur.phase&&!used[s.id]; }).map(function(s){ return stepOk(s,sub,'firm'); }).filter(Boolean);
      return cands.length?pick(cands):null;
    }
    function show(){
      if(i>=steps.length){ endScene('done'); return; }
      var it=steps[i], s=it.step, isClose=s.phase==='close';
      var total=isClose?300:rollSec(s.min,s.max,1), left=total, endAt=Date.now()+total*1000, pauseAt=null;
      sceneEl.innerHTML='';
      sceneEl.appendChild(el('div','s-head','Dominion · '+nameOf(dom)+' holds the power'));
      sceneEl.appendChild(el('div','s-step','Step '+(i+1)+' of '+steps.length+' · '+PHASES[s.phase]));
      var card=el('div','s-card '+s.phase);
      var chips=el('div','chips'); chips.style.justifyContent='flex-start';
      if(s.intense) chips.appendChild(el('span','tag dare','Intense'));
      if(it.maybe) chips.appendChild(el('span','tag him','Maybe on the sheet — check in first'));
      if(chips.childNodes.length) card.appendChild(chips);
      card.appendChild(el('h2',null,s.title));
      card.appendChild(el('p',null,s.text));
      if(s.sub){ var r=el('div','sub-rule'); r.appendChild(el('b',null,'Rule for '+nameOf(sub))); r.appendChild(document.createTextNode(s.sub)); card.appendChild(r); }
      var tm=el('div','s-timer'), mini=el('div','mini');
      mini.innerHTML='<svg viewBox="0 0 100 100" aria-hidden="true"><circle class="ring-track" cx="50" cy="50" r="'+RING_R+'"/><circle class="ring-fill" cx="50" cy="50" r="'+RING_R+'" stroke-dasharray="'+CIRC+'" stroke-dashoffset="0"/></svg>';
      var big=el('div','big',fmt(left)); mini.appendChild(big); tm.appendChild(mini);
      var note=el('div','s-note',isClose?'Five minutes. Then the phone goes away.':'The bell decides when you may move on.'); tm.appendChild(note);
      card.appendChild(tm);
      var btns=el('div','s-btns');
      var next=el('button','primary-btn',isClose?'End the scene':'Next step'); next.disabled=!isClose;
      next.addEventListener('click',function(){ stopInt(); i++; show(); });
      btns.appendChild(next);
      if(!isClose){
        var veto=el('button','quiet-btn',nameOf(sub)+' vetoes this step');
        veto.addEventListener('click',function(){ stopInt(); stats.vetoes++; save(); var alt=replacement(s); if(alt){ steps[i]=alt; toast('Step replaced. No questions.'); } else { steps.splice(i,1); toast('Step removed.'); } show(); });
        btns.appendChild(veto);
      }
      card.appendChild(btns); sceneEl.appendChild(card);
      var sw=el('div','safewords');
      var y=el('button','yellow'); y.appendChild(document.createTextNode('Yellow')); y.appendChild(el('small',null,'pause & check in'));
      var rd=el('button','red'); rd.appendChild(document.createTextNode('Red')); rd.appendChild(el('small',null,'stop everything'));
      sw.appendChild(y); sw.appendChild(rd); sceneEl.appendChild(sw);
      rd.addEventListener('click',function(){ endScene('red'); });
      y.addEventListener('click',function(){
        if(paused) return; paused=true; pauseAt=Date.now(); alarm();
        var ci=el('div','overlay'); ci.style.zIndex='75'; var box=el('div','checkin');
        box.appendChild(el('h2',null,'Yellow.'));
        box.appendChild(el('p',null,nameOf(dom)+': stop what you’re doing. Don’t untie unless asked. Ask, out loud: “Are you okay? What do you need?” Then listen. The clock is paused.'));
        var b1=el('button','primary-btn','Continue'), b2=el('button','quiet-btn','Skip this step'), b3=el('button','quiet-btn','Red — end it');
        var bb=el('div','card-btns'); bb.appendChild(b1); bb.appendChild(b2); bb.appendChild(b3); box.appendChild(bb); ci.appendChild(box); document.body.appendChild(ci);
        b1.addEventListener('click',function(){ endAt+=Date.now()-pauseAt; paused=false; ci.remove(); });
        b2.addEventListener('click',function(){ paused=false; ci.remove(); stopInt(); i++; show(); });
        b3.addEventListener('click',function(){ ci.remove(); endScene('red'); });
      });
      var lastShown=left;
      sceneInt=setInterval(function(){
        if(paused) return;
        left=Math.max(0,Math.round((endAt-Date.now())/1000));
        if(left!==lastShown){
          lastShown=left; big.textContent=fmt(left);
          mini.querySelector('.ring-fill').setAttribute('stroke-dashoffset',String(CIRC*(1-left/total)));
          if(left<=10){ mini.classList.add('hot'); if(left>0) heartbeat(); }
        }
        if(left<=0){ stopInt(); bell(); vibrate([120,80,120]); next.disabled=false; next.textContent=isClose?'End the scene':'Next step — the bell says so'; note.textContent='Bell. Finish the sentence you were on, then move on.'; }
      },200);
    }
    show();
  }

  /* ---------- wire up ---------- */
  hub.addEventListener('pointerdown',chargeBegin);
  window.addEventListener('pointerup',chargeEnd);
  window.addEventListener('pointercancel',chargeEnd);
  hub.addEventListener('contextmenu',function(e){ e.preventDefault(); });
  hub.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); spin(.5); } });
  canvas.addEventListener('click',function(){ spin(.3+Math.random()*.5); });
  document.getElementById('turnBtn').addEventListener('click',function(){ turn=turn==='her'?'him':'her'; save(); updateTurn(); });
  document.getElementById('rulesBtn').addEventListener('click',function(){ showGate(false); });
  document.getElementById('editBtn').addEventListener('click',showSettings);
  document.getElementById('finishBtn').addEventListener('click',showFinish);
  document.getElementById('limitsBtn').addEventListener('click',showLimits);
  document.getElementById('domBtn').addEventListener('click',showSceneSetup);
  window.addEventListener('resize',sizeCanvas);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
  updateHeatUI(); updateTurn(); sizeCanvas();
  showGate(true);
})();
</script>
