name: Release Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'apk-v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare Capacitor wrapper
        working-directory: packaging/android-wrapper
        run: |
          npm install
          mkdir -p www
          cp ../../index.html www/index.html
          npx cap add android

      - name: Build debug APK
        working-directory: packaging/android-wrapper/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=apk-$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp packaging/android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk VelvetAndRoulette.apk
          gh release create "${{ steps.tag.outputs.tag }}" VelvetAndRoulette.apk \
            --title "Velvet & Roulette (${{ steps.tag.outputs.tag }})" \
            --notes "Debug-signed Android APK, built from \`index.html\` at this commit. To install: download on your phone, allow installs from this source when prompted, then open the file. Android will flag it as an unverified developer — expected, since this isn't Play Store-distributed."
